[project]
name = "maint-copilot"
version = "0.0.1"
description = "Agentic, evaluated retrieval assistant over industrial maintenance documents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "bm25s>=0.3.16",
    "PyStemmer>=2.2",
    "sentence-transformers>=6.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maint_copilot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
